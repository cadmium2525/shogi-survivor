name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check and production build
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/shogi-preview.log" 2>&1 &
          node --input-type=module <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              if ((await fetch('http://127.0.0.1:4173/')).ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          if (!ready) throw new Error('Production preview did not start');
          NODE
      - name: Chromium layout and complete campaign
        run: npm run test:browser
        env:
          TEST_URL: http://127.0.0.1:4173/
          PLAYWRIGHT_BROWSER: chromium
      - name: WebKit layout and complete campaign
        run: npm run test:browser
        env:
          TEST_URL: http://127.0.0.1:4173/
          PLAYWRIGHT_BROWSER: webkit
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
